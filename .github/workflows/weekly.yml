name: Update weekly site data

on:
  schedule:
    # 10:00 UTC Wednesday is 6 AM Eastern (5 AM in winter): Monday night
    # games are in nflverse play-by-play by then, and it is before Thursday
    # night's game.
    - cron: '0 10 * * 3'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Shared with the daily job, which fires at the same minute: the two queue
# instead of racing to push to main.
concurrency:
  group: update-site-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      PBP_CACHE_DIR: ${{ github.workspace }}/pipelines/.cache/pbp
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipelines/requirements.txt

      - name: Install pipeline dependencies
        run: pip install -r pipelines/requirements.txt

      - name: Test pipelines
        run: python -m unittest discover -s pipelines

      # Cache entries are immutable, so each run saves a new one under its
      # run id and the next run restores the newest by prefix. Completed
      # seasons are reused from here; pipelines/pbp_cache.py refreshes the
      # current one. GitHub evicts entries unused for 7 days, so a late
      # weekly run can miss; that costs one download, never wrong data.
      - name: Restore play-by-play cache
        uses: actions/cache@v6
        with:
          path: pipelines/.cache/pbp
          key: pbp-${{ github.run_id }}
          restore-keys: pbp-

      - name: Build site data
        run: python pipelines/run_weekly.py

      - name: Commit changed data
        id: commit
        run: |
          # status, not diff: a data file the pipeline adds for the first
          # time is untracked, and git diff does not see untracked files.
          if [ -z "$(git status --porcelain -- src/data)" ]; then
            echo "No data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data
          git commit -m "Update weekly site data for $(TZ=America/New_York date +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN do not trigger push workflows, so the
      # deploy has to be started explicitly.
      - name: Trigger deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
